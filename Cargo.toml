[package]
name = "agy-browser"
version = "0.1.0"
edition = "2021"
description = "MCP server that lets agy drive your real Chrome through a companion extension"

[dependencies]
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "time"] }
tokio-tungstenite = "0.26"

[profile.release]
lto = true
strip = true
